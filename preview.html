<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>检查与预览 - 体验反馈工作台</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/completeness.js" defer></script>
  <script src="assets/js/preview.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">体验反馈工作台</a>
      <a class="nav-link" href="feedback-form.html">返回编辑</a>
    </nav>
  </header>

  <main class="page-shell narrow">
    <section class="section-block compact-heading">
      <p class="eyebrow">结构化预览</p>
      <h1>检查整理后的反馈内容</h1>
      <p class="lead small">本阶段只读取当前标签页的临时填写内容，不实现复制纯文本或保存到历史。</p>
    </section>

    <section class="card alert" aria-labelledby="empty-title" data-empty-state hidden>
      <h2 id="empty-title">还没有可预览的填写内容</h2>
      <p>没有从当前浏览器标签页读取到反馈草稿。请先返回填写页输入内容。</p>
      <a class="button primary" href="feedback-form.html">返回填写</a>
    </section>

    <section class="card completeness-card" aria-labelledby="completeness-title" data-completeness-state hidden>
      <div class="card-topline">
        <span class="tag">完整度检查</span>
        <span data-completeness-level class="level-badge"></span>
      </div>
      <h2 id="completeness-title">信息完整度检查</h2>
      <div class="check-grid">
        <div>
          <h3>缺失字段</h3>
          <p data-missing-empty hidden>必填项已填写。</p>
          <ul data-missing-list></ul>
        </div>
        <div>
          <h3>温和补充建议</h3>
          <p data-suggestions-empty hidden>当前没有额外补充建议。</p>
          <ul data-suggestions-list></ul>
        </div>
      </div>
    </section>

    <section class="card preview-card" aria-labelledby="preview-title" data-preview-state hidden>
      <div class="card-topline">
        <span class="tag">结构化预览</span>
        <span>匿名反馈草稿</span>
      </div>
      <h2 id="preview-title"></h2>
      <dl class="preview-list" data-preview-list></dl>
    </section>

    <div class="form-actions card" data-preview-actions hidden>
      <a class="button secondary" href="feedback-form.html">返回编辑</a>
      <button class="button ghost" type="button" disabled>复制纯文本（暂不可用）</button>
      <button class="button primary" type="button" disabled>保存到历史（暂不可用）</button>
    </div>
  </main>
</body>
</html>
