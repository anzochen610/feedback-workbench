<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体验反馈工作台</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/completeness.js" defer></script>
  <script src="assets/js/history-storage.js" defer></script>
  <script src="assets/js/home.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">体验反馈工作台</a>
      <a class="nav-link" href="feedback-form.html?new=1">新建反馈</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="hero card">
      <h1>体验反馈工作台</h1>
      <p class="lead">帮助非产品岗位新人，把零散的产品使用感受整理成结构更清楚的反馈文本。</p>
      <div class="notice-grid">
        <div class="notice">
          <h2>适合谁使用</h2>
          <p>适合市场实习生、内容运营、用户运营等需要向产品或研发同学说明体验问题的新手。</p>
        </div>
        <div class="notice warning">
          <h2>匿名与隐私提醒</h2>
          <p>请不要填写真实公司、产品、部门、同事、客户或内部资料名称，示例统一使用匿名表达。</p>
        </div>
        <div class="notice">
          <h2>本地保存提醒</h2>
          <p>历史反馈只保存在当前浏览器。清除浏览器数据后可能丢失，更换浏览器或设备后不会同步。</p>
        </div>
      </div>
      <a class="button primary large" href="feedback-form.html?new=1">新建反馈</a>
    </section>

    <section class="section-block" aria-labelledby="history-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">历史反馈</p>
          <h2 id="history-title">查看已保存的反馈</h2>
        </div>
        <a class="button primary" href="feedback-form.html?new=1">新建反馈</a>
      </div>

      <div class="history-empty card" data-history-empty hidden>
        <p>还没有历史反馈，创建并保存第一条反馈吧。</p>
        <a class="button primary" href="feedback-form.html?new=1">新建反馈</a>
      </div>

      <div class="history-list" data-history-list></div>
    </section>
  </main>
</body>
</html>
